section {

.header {
  position: fixed;
  opacity: 0.8;
  top: 0;

  display: flex;
  justify-content: space-between;

  transition: all 0.8s;
}
.header.sticky {
  opacity: 0.9;
  padding: 2rem 10% 2rem 5%; /* Adjusted padding to ensure space for the sign-in button */

  box-shadow: 0 0 1.5px 2px rgb(14, 14, 14, 0.8);
}

nav {

.logo {

.navbar a {
  /* position: relative; */
  font-size: 1.4rem;
  /* left: 118px; */
  color: var(--txt-color);
  margin-right: 3.1rem;
  transition: 0.3s;
}
.navbar a:hover {
  color: var(--main-color);
  animation: blink 1s infinite;
  transform: scale(1.1);
  text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.1);
}

@keyframes blink {
  0%,
  100% {
    color: var(--main-color);
  }
  50% {
    color: transparent;
  }
}

.navbar a:not(.active):hover {
  color: var(--main-color);
}

.navbar a.active,
.navbar a.active:hover {
  color: var(--main-color);
}
.navbar.active {
  display: block;
}
.navbar a {
  position: relative;
  font-size: 1.5rem;
  color: var(--txt-color);
  margin-right: 3.1rem;
  transition: 0.3s;
}

.navbar a:hover::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 2px; /* Adjust height as needed */
  background-color: rgb(255, 255, 255); /* Change to the desired color */
  left: 0;
  bottom: -5px; /* Adjust position as needed */
}

.navbar a::after {
  content: "";
  position: absolute;
  width: 0;
  height: 2px; /* Adjust height as needed */
  background-color: rgb(255, 255, 255); /* Change to the desired color */
  left: 0;
  bottom: -5px; /* Adjust position as needed */
  transition: width 0.5s;
}

    <!-- Checkout Button -->
    <a href="checkout.html"><button id="checkout">Checkout</button></a> 

    <script>
        // Sample booked dates for the tractor
        const bookedDates = ["2024-12-20", "2024-12-21"];

        document.getElementById('checkout').addEventListener('click', () => {
            const date = document.getElementById('booking-date').value;
            const time = document.getElementById('booking-time').value;

            if (!date || !time) {
                alert('Please select both date and time for booking.');
                return;
            }

            if (bookedDates.includes(date)) {
                alert('Available for that date.');
                return;
            }

            alert(`Your Booking confirmed for ${date} at ${time}.`);
        });
    </script>
